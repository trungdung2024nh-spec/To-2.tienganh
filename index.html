<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Songkran Festival - Welcome</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #061b31;
    font-family: Arial, sans-serif;
}

/* 9:16 FRAME */
.page {
    position: absolute;
    width: min(100vw, 56.25vh);
    height: min(177.7778vw, 100vh);

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    overflow: hidden;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;

    color: white;

    background:
        linear-gradient(
            180deg,
            rgba(0,145,215,0.78),
            rgba(0,43,82,0.95)
        ),
        url("https://commons.wikimedia.org/wiki/Special:Redirect/file/Grand_songkran_%28Thai_New_Year_%29_Water_Festival.jpg");

    background-size: cover;
    background-position: center;

    animation: pageIn 1.2s ease;
}

@keyframes pageIn {
    from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.88);
    }

    to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
}


/* WATER EFFECTS */

.drop {
    position: absolute;
    border-radius: 50%;

    background: rgba(255,255,255,0.18);

    animation: floating 5s ease-in-out infinite;
}

.drop1 {
    width: 120px;
    height: 120px;
    left: -35px;
    top: 5%;
}

.drop2 {
    width: 65px;
    height: 65px;
    right: -15px;
    top: 25%;
    animation-delay: 1s;
}

.drop3 {
    width: 90px;
    height: 90px;
    left: -20px;
    bottom: 15%;
    animation-delay: 2s;
}

.drop4 {
    width: 55px;
    height: 55px;
    right: -10px;
    bottom: 8%;
    animation-delay: 1.5s;
}

@keyframes floating {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-22px);
    }
}


/* TEXT */

.welcome {
    position: relative;
    z-index: 5;

    font-size: 2.5vh;
    letter-spacing: 4px;
    font-weight: bold;

    opacity: 0;

    animation: fadeDown 1s forwards;
    animation-delay: 0.3s;
}

@keyframes fadeDown {
    from {
        opacity: 0;
        transform: translateY(-30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


.school {
    position: relative;
    z-index: 5;

    width: 90%;

    margin-top: 4%;

    font-size: 3.4vh;
    line-height: 1.35;

    font-weight: 900;

    opacity: 0;

    animation: fadeUp 1s forwards;
    animation-delay: 0.7s;
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


.line {
    position: relative;
    z-index: 5;

    width: 65%;
    height: 3px;

    margin: 6% 0;

    background: white;

    transform: scaleX(0);

    animation: lineGrow 1s forwards;
    animation-delay: 1.1s;
}

@keyframes lineGrow {
    to {
        transform: scaleX(1);
    }
}


/* SONGKRAN */

.songkran {
    position: relative;
    z-index: 5;

    font-size: 8.5vh;

    font-weight: 900;

    letter-spacing: 4px;

    text-shadow:
        0 6px 0 rgba(0,70,120,0.8),
        0 0 35px rgba(255,255,255,0.8);

    opacity: 0;

    animation:
        songkranIn 1.2s forwards,
        pulse 3s infinite ease-in-out 2.3s;

    animation-delay: 1.4s;
}

@keyframes songkranIn {
    from {
        opacity: 0;
        transform: scale(0.3) rotate(-5deg);
    }

    to {
        opacity: 1;
        transform: scale(1) rotate(0);
    }
}

@keyframes pulse {
    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.05);
    }
}


.subtitle {
    position: relative;
    z-index: 5;

    margin-top: 3%;

    font-size: 2.4vh;

    letter-spacing: 2px;

    opacity: 0;

    animation: fadeUp 1s forwards;
    animation-delay: 2s;
}


/* INFORMATION */

.info {
    position: relative;
    z-index: 5;

    width: 82%;

    margin-top: 8%;

    padding: 5%;

    border-radius: 22px;

    background: rgba(255,255,255,0.16);

    border: 1px solid rgba(255,255,255,0.55);

    backdrop-filter: blur(8px);

    font-size: 2.4vh;

    line-height: 1.8;

    opacity: 0;

    animation: boxIn 1s forwards;
    animation-delay: 2.4s;
}

@keyframes boxIn {
    from {
        opacity: 0;
        transform: translateY(25px) scale(0.9);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.info span {
    font-weight: bold;
}


/* BUTTON */

.next {
    position: absolute;

    z-index: 10;

    bottom: 4%;

    padding: 12px 25px;

    border-radius: 30px;

    background: white;

    color: #0077ad;

    text-decoration: none;

    font-size: 1.8vh;

    font-weight: bold;

    box-shadow: 0 5px 20px rgba(0,0,0,0.25);

    opacity: 0;

    animation: buttonIn 1s forwards;
    animation-delay: 3s;

    transition: 0.3s;
}

@keyframes buttonIn {
    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.next:hover {
    transform: scale(1.08);
}
</style>
</head>


<body>

<div class="page">

    <div class="drop drop1"></div>
    <div class="drop drop2"></div>
    <div class="drop drop3"></div>
    <div class="drop drop4"></div>


    <div class="welcome">
        WELCOME TO OUR PRESENTATION
    </div>


    <div class="school">
        TRƯỜNG THPT TÔN ĐỨC THẮNG-NAM NINH HÒA
    </div>


    <div class="line"></div>


    <div class="songkran">
        SONGKRAN
    </div>


    <div class="subtitle">
        THE THAI NEW YEAR FESTIVAL
    </div>


    <div class="info">

        <div>
            <span>Class:</span> 12C4
        </div>

        <div>
            <span>Group:</span> Group 2
        </div>

        <div>
            <span>Topic:</span> Songkran Festival
        </div>

    </div>


    <a class="next" href="content.html">
        START PRESENTATION →
    </a>

</div>

</body>
</html>
