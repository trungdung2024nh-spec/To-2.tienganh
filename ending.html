<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Songkran Festival - Thank You</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #061b31;

    font-family: Arial, sans-serif;
}


/* ===== 9:16 FRAME ===== */

.page {

    position: absolute;

    width: min(100vw, 56.25vh);
    height: min(177.7778vw, 100vh);

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    overflow: hidden;

    color: white;

    text-align: center;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    background:
        linear-gradient(
            160deg,
            rgba(0,145,210,0.78),
            rgba(0,43,82,0.96)
        ),
        url("https://commons.wikimedia.org/wiki/Special:Redirect/file/Songkran_Festival_2019.JPG");

    background-size: cover;

    background-position: center;

    animation: pageIn 1.3s ease;
}

@keyframes pageIn {

    from {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(0.85);
    }

    to {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);
    }
}


/* ===== WATER EFFECT ===== */

.drop {

    position: absolute;

    border-radius: 50%;

    background: rgba(255,255,255,0.18);

    animation: float 5s ease-in-out infinite;
}

.drop1 {
    width: 120px;
    height: 120px;

    left: -30px;
    top: 8%;
}

.drop2 {
    width: 70px;
    height: 70px;

    right: -15px;
    top: 25%;

    animation-delay: 1s;
}

.drop3 {
    width: 90px;
    height: 90px;

    left: -20px;
    bottom: 12%;

    animation-delay: 2s;
}

.drop4 {
    width: 60px;
    height: 60px;

    right: -10px;
    bottom: 8%;

    animation-delay: 1.5s;
}

@keyframes float {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-22px);
    }
}


/* ===== CONTENT ===== */

.small-title {

    position: relative;
    z-index: 5;

    font-size: 2.5vh;

    letter-spacing: 4px;

    font-weight: bold;

    opacity: 0;

    animation: fadeDown 1s forwards;

    animation-delay: 0.5s;
}

@keyframes fadeDown {

    from {
        opacity: 0;

        transform:
            translateY(-35px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }
}


.thank-you {

    position: relative;
    z-index: 5;

    margin-top: 5%;

    font-size: 7.5vh;

    line-height: 1;

    font-weight: 900;

    letter-spacing: 3px;

    text-shadow:
        0 6px 0 rgba(0,70,120,0.75),
        0 0 35px rgba(255,255,255,0.7);

    opacity: 0;

    animation:
        thankYouIn 1.3s forwards,
        pulse 3s infinite ease-in-out 2.5s;

    animation-delay: 1s;
}

@keyframes thankYouIn {

    from {
        opacity: 0;

        transform:
            scale(0.3)
            rotate(-4deg);
    }

    to {
        opacity: 1;

        transform:
            scale(1)
            rotate(0);
    }
}

@keyframes pulse {

    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.05);
    }
}


.line {

    width: 55%;

    height: 3px;

    background: white;

    margin: 7% 0;

    transform: scaleX(0);

    animation: lineGrow 1s forwards;

    animation-delay: 1.8s;
}

@keyframes lineGrow {

    to {
        transform: scaleX(1);
    }
}


.message {

    position: relative;
    z-index: 5;

    width: 88%;

    font-size: 3vh;

    line-height: 1.5;

    opacity: 0;

    animation: messageIn 1s forwards;

    animation-delay: 2.1s;
}

@keyframes messageIn {

    from {
        opacity: 0;

        transform:
            translateY(25px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }
}


.songkran {

    position: relative;
    z-index: 5;

    margin-top: 7%;

    font-size: 4vh;

    font-weight: 900;

    letter-spacing: 3px;

    opacity: 0;

    animation: fadeUp 1s forwards;

    animation-delay: 2.6s;
}

@keyframes fadeUp {

    from {
        opacity: 0;

        transform:
            translateY(25px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }
}


/* ===== NAVIGATION ===== */

.navigation {

    position: absolute;

    z-index: 20;

    bottom: 4%;

    left: 0;
    right: 0;

    display: flex;

    justify-content: space-between;

    padding: 0 7%;
}

.navigation a {

    text-decoration: none;

    background: white;

    color: #0077ad;

    padding: 11px 20px;

    border-radius: 25px;

    font-size: 1.7vh;

    font-weight: bold;

    transition: 0.3s;
}

.navigation a:hover {

    transform: scale(1.08);

    background: #e9faff;
}
</style>
</head>


<body>

<div class="page">


    <!-- WATER -->

    <div class="drop drop1"></div>
    <div class="drop drop2"></div>
    <div class="drop drop3"></div>
    <div class="drop drop4"></div>


    <!-- CONTENT -->

    <div class="small-title">
        OUR PRESENTATION HAS COME TO AN END
    </div>


    <div class="thank-you">
        THANK YOU!
    </div>


    <div class="line"></div>


    <div class="message">
        Thank you, teachers and friends,<br>
        for listening to our presentation.
    </div>


    <div class="songkran">
        HAPPY SONGKRAN!
    </div>


    <!-- NAVIGATION -->

    <div class="navigation">

        <a href="content.html">
            ← BACK
        </a>

        <a href="index.html">
            HOME
        </a>

    </div>

</div>

</body>
</html>
